<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Access Code</title>
    <link rel="stylesheet" href="OTPEnterPage.css">
</head>
<body>
	
    <div class="otp-container">
        <h2>Forgot Password</h2>
        <p>Enter the email for which you want to reset the password.</p>

        <div id="errorBanner" class="error-banner"></div>

        <form action="PasswordResetServlet" method="POST">
            <div class="form-group">
                <input type="email" name="email"  placeholder="Enter the Email"  required ="required">
            </div>
            <button type="submit" class="submit-btn">Send Reset Link</button>
        </form>
    </div>
</body>
</html>
