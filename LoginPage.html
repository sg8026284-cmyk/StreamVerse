<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <div id="statusMsg" class="status-msg"></div>

        <form action="LoginServlet" method="POST">
            <div class="form-group">
                <label for="email">Account Email</label>
                <input type="email" id="email" name="user_email" placeholder="name@domain.com" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Security Password</label>
                <input type="password" id="password" name="pwd_1" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Access Workspace</button>
        </form>

        <div class="links">
            New traveler? <a href="RegisterPage.html">Create an Account</a>
        </div>
        <div class="links">
        <a href="PasswordResetPage.html">Forgot Password ?</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const box = document.getElementById('statusMsg');
        if (params.get('signup') === 'success') {
            box.style.display = 'block';
            box.className = 'status-msg success';
            box.innerText = 'Registration verified. You may now authenticate.';
        } else if (params.get('error') === 'invalid_credentials') {
            box.style.display = 'block';
            box.className = 'status-msg error';
            box.innerText = 'Invalid credentials provided. Verify credentials.';
        }
    </script>
</body>
</html>
